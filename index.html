<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // iOS WKWebView (Safari and standalone/Home-Screen PWAs alike) doesn't reliably resolve
      // dvh to the true visible viewport on a cold, non-scrolling page — it only seems to commit
      // to the correct value once something (real overflow, a scroll) forces it. Measuring the
      // real height in JS and exposing it as --vh sidesteps that entirely: this is always exact,
      // regardless of any browser-internal viewport bookkeeping quirk. Runs in <head>, before
      // body's layout, so nothing downstream ever sees the wrong value.
      function setViewportHeightVar() {
        var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight)
        document.documentElement.style.setProperty('--vh', h + 'px')
      }
      setViewportHeightVar()
      window.addEventListener('resize', setViewportHeightVar)
      window.addEventListener('orientationchange', setViewportHeightVar)
      window.addEventListener('pageshow', setViewportHeightVar)
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setViewportHeightVar)
      }
    </script>
    <!-- Matches the app's actual gradient (light: pink top stop, dark: the CSS dark-mode
         --page-bg base), not the dark-navy/pure-white left over from the original template.
         iOS uses this to color the safe-area chrome around the app (status bar / home
         indicator backdrop) — a mismatch here is exactly what shows up as a wrong-colored
         bar at the top/bottom of the screen instead of the gradient. -->
    <meta name="theme-color" content="#060a12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffa9d7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A simple, beautiful workout companion for beginners." />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Fitness</title>
  </head>
  <body>
    <!-- Real, static element (not a CSS ::before) so the fixed gradient backdrop is present in
         the raw HTML from the first byte — no JS/React mount required before it can paint. -->
    <div id="app-bg"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
