<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="A simple, beautiful workout companion for beginners." />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Fitness</title>
  </head>
  <body>
    <!-- Real, static element (not a CSS ::before) so the fixed gradient backdrop is present in
         the raw HTML from the first byte — no JS/React mount required before it can paint. -->
    <div id="app-bg"></div>
    <div id="root"></div>
    <script>
      // iOS WKWebView (both Safari and standalone/Home-Screen PWAs) initializes the viewport's
      // safe-area/layout metrics on cold launch using a stale value, and only recomputes them
      // once a scroll event actually fires — which is why position: fixed chrome (the bottom
      // nav) and the safe-area padding around it visibly "snap" into their correct place the
      // first time the page is scrolled. Firing an imperceptible 1px synthetic scroll on load
      // forces that recalculation immediately, before the user ever has to scroll themselves.
      window.addEventListener('pageshow', function () {
        window.scrollTo(0, 1)
        requestAnimationFrame(function () {
          window.scrollTo(0, 0)
        })
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
